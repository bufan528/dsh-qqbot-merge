# dsh-qqbot-merge bundle patch
#
# 本包是 @tencent-connect/dsh-qqbot 0.5.3（MIT）的维护分支，安装方式：
#   npx @deepseek-ai/dsh plugin --profile <name> add dsh-qqbot-merge
# 安装后 dsh 启动时自动加载此 patch（行 id 与上游 `im-qqbot` 不同：`qqbot-merge`，
# 因此本包与官方插件**不能同时启用**——两者都会连接同一个 QQ Bot appId，
# 且都注册绑定页 HTTP 路由）。
#
# 环境变量：
#   QQBOT_APPID  - QQ Bot AppID（必填）
#   QQBOT_SECRET - QQ Bot AppSecret（必填）
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch

# ── 插入 qqbot-merge 插件行 ──
- insert:
    - id: qqbot-merge
      name: 'dsh-qqbot-merge'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
        # provider/model 留空：从宿主默认模型路由继承
        # 用户可通过 /model 命令在聊天中切换
        requireMention: true
        textChunkLimit: 4500
        sessionIdleTimeout: 1800000
        maxQueue: 20
        processingTimeoutMs: 1800000
        historyLimit: 10
        access:
          c2cMode: open
          c2cAllow: []
          groupMode: open
          groupAllow: []
        debug: false
        # 连续消息智能合并（契约 qqbot-merge@v1）。
        # enabled 默认 false：行为与官方 0.5.3 完全一致；由 qqbotMerge 服务
        # （Memory Vault 的 QQ 合并页）或 profile cordis.patch.yml 打开。
        qqbotMerge:
          enabled: false
          windowMs: 800
          maxBatchMessages: 8
          maxBatchChars: 4000
          scope:
            c2c: true
            group: false
          busyPolicy: steer
          replyMode: single-message
